name: Sign Checkpoint (T1)

# Three-phase pipeline:
#   Phase 1 — Emit:    create a signed checkpoint from the current ledger tip
#   Phase 2 — Verify:  validate signature, registry membership, trust tier
#   Phase 3 — Publish: open a PR; merge is the governance ratification gate
#
# Failures in Phase 3 (publication) do not invalidate Phases 1–2 (artifact + proof).
# Branch protection is intentional — checkpoint publication requires a governed merge.
#
# After the first T1 checkpoint is merged, uncomment --require-t1 in
# checkpoint-trust.yml to complete enforcement.

on:
  push:
    branches: [main]
    paths:
      - 'ledger.jsonl'
  workflow_dispatch:

permissions:
  contents: write       # push checkpoint branch
  pull-requests: write  # open publication PR

jobs:
  sign-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pynacl --quiet

      # ── Phase 1: Emit ─────────────────────────────────────────────────────────
      - name: Check secret and write signing key
        id: write-key
        env:
          LEDGER_SIGNING_KEY: ${{ secrets.LEDGER_SIGNING_KEY }}
        run: |
          if [[ -z "$LEDGER_SIGNING_KEY" ]]; then
            echo "::warning::LEDGER_SIGNING_KEY not set — skipping T1 checkpoint. Add the secret to enable T1 signing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$HOME/.assay/keys"
            echo "$LEDGER_SIGNING_KEY" | base64 -d > "$HOME/.assay/keys/assay-ci.key"
            chmod 600 "$HOME/.assay/keys/assay-ci.key"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Emit checkpoint
        id: emit
        if: steps.write-key.outputs.skip == 'false'
        run: |
          python create_checkpoint.py --signer-id assay-ci --ledger ledger.jsonl
          LATEST=$(ls checkpoints/checkpoint_*.json | sort | tail -1)
          echo "checkpoint_file=$LATEST" >> "$GITHUB_OUTPUT"
          echo "checkpoint_name=$(basename $LATEST .json)" >> "$GITHUB_OUTPUT"
          echo "artifact_status=produced" >> "$GITHUB_OUTPUT"

      # ── Phase 2: Verify ───────────────────────────────────────────────────────
      - name: Verify checkpoint
        id: verify
        if: steps.write-key.outputs.skip == 'false'
        run: |
          LATEST="${{ steps.emit.outputs.checkpoint_file }}"
          python verify_checkpoint.py "$LATEST" --registry signers.json
          echo "verification_status=passed" >> "$GITHUB_OUTPUT"
          echo "::notice title=T1 Checkpoint Verified::$LATEST verified at trust_tier=T1"

      # ── Phase 3: Publish (via PR) ─────────────────────────────────────────────
      - name: Push checkpoint branch
        id: push-branch
        if: steps.write-key.outputs.skip == 'false'
        run: |
          NAME="${{ steps.emit.outputs.checkpoint_name }}"
          # Include run ID to avoid branch collision on retries
          BRANCH="checkpoint/${NAME}-run${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "${{ steps.emit.outputs.checkpoint_file }}"
          git commit -m "chore(checkpoint): T1 signed ${NAME}

          artifact_status: produced
          verification_status: ${{ steps.verify.outputs.verification_status }}
          publication_status: pending_pr_merge
          signer: assay-ci (T1)"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open publication PR
        if: steps.write-key.outputs.skip == 'false'
        env:
          # CHECKPOINT_PR_TOKEN must be a PAT with repo+workflow scopes (or a
          # fine-grained token with pull-requests:write + workflows:read).
          # PRs opened with a PAT trigger pull_request workflows normally.
          # PRs opened with GITHUB_TOKEN do NOT — a manual synchronize push
          # is required. See docs/ratification.md for the fallback procedure.
          GH_TOKEN: ${{ secrets.CHECKPOINT_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          NAME="${{ steps.emit.outputs.checkpoint_name }}"
          BRANCH="${{ steps.push-branch.outputs.branch }}"
          gh pr create \
            --title "chore(checkpoint): publish T1 signed ${NAME}" \
            --body "$(printf '## Checkpoint publication\n\nThis PR ratifies a T1 signed checkpoint into the protected ledger history.\n\n| Field | Value |\n|-------|-------|\n| Checkpoint | `%s` |\n| Signer | `assay-ci` (T1) |\n| artifact_status | produced |\n| verification_status | passed |\n| publication_status | pending_pr_merge |\n\nMerging this PR constitutes governance ratification of the checkpoint.\n\nVerify locally:\n```\npython verify_checkpoint.py %s --registry signers.json\n```' "$NAME" "${{ steps.emit.outputs.checkpoint_file }}")" \
            --base main \
            --head "$BRANCH"
