name: Sign Checkpoint (T1)

# Runs on every push to main. Creates a signed checkpoint using the CI-bound
# T1 key stored in LEDGER_SIGNING_KEY (GitHub Actions Secret).
#
# Produces: checkpoints/checkpoint_NNNN.json signed by signer_id=assay-ci
# Commits the checkpoint back to main automatically.
#
# Prerequisites:
#   - LEDGER_SIGNING_KEY secret must be set (base64-encoded Ed25519 seed, 32 bytes)
#   - assay-ci entry must exist in signers.json with matching pubkey_sha256
#
# After the first checkpoint produced by this workflow, uncomment --require-t1
# in checkpoint-trust.yml to complete T1 enforcement.

on:
  push:
    branches: [main]
    paths:
      - 'ledger.jsonl'

permissions:
  contents: write   # needed to commit the checkpoint back

jobs:
  sign-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pynacl --quiet

      - name: Write signing key from secret
        env:
          LEDGER_SIGNING_KEY: ${{ secrets.LEDGER_SIGNING_KEY }}
        run: |
          if [[ -z "$LEDGER_SIGNING_KEY" ]]; then
            echo "::error::LEDGER_SIGNING_KEY secret is not set. Cannot sign checkpoint."
            exit 1
          fi
          # create_checkpoint.py reads from ~/.assay/keys/{signer_id}.key
          mkdir -p "$HOME/.assay/keys"
          echo "$LEDGER_SIGNING_KEY" | base64 -d > "$HOME/.assay/keys/assay-ci.key"
          chmod 600 "$HOME/.assay/keys/assay-ci.key"

      - name: Create signed checkpoint
        run: |
          python create_checkpoint.py \
            --signer-id assay-ci \
            --ledger ledger.jsonl

      - name: Verify the new checkpoint
        run: |
          LATEST=$(ls checkpoints/checkpoint_*.json | sort | tail -1)
          echo "Verifying: $LATEST"
          python verify_checkpoint.py "$LATEST" --registry signers.json
          echo "::notice title=T1 Checkpoint::Created and verified $LATEST (trust_tier=T1)"

      - name: Commit checkpoint to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LATEST=$(ls checkpoints/checkpoint_*.json | sort | tail -1)
          git add "$LATEST"
          git diff --cached --quiet && echo "No new checkpoint to commit" && exit 0
          git commit -m "chore(checkpoint): T1 signed checkpoint $(basename $LATEST .json)"
          git push
