name: Validate Ledger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: pip install pytest --quiet

      - name: Run adversarial regression tests
        run: python -m pytest tests/ -v

      - name: Validate ledger.jsonl
        run: python validate_ledger.py

      - name: Check append invariant (PRs and merge queue)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          # Determine base ref
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE_REF="${{ github.event.merge_group.base_ref }}"
          else
            BASE_REF="origin/${{ github.base_ref }}"
          fi

          # Fetch base branch and extract base ledger
          git fetch origin "${{ github.base_ref || github.event.merge_group.base_ref }}" --depth=1 2>/dev/null || true
          git show "${BASE_REF}:ledger.jsonl" > /tmp/base_ledger.jsonl 2>/dev/null || touch /tmp/base_ledger.jsonl

          # Get changed files for scope check
          CHANGED_FILES=$(git diff --name-only "${BASE_REF}"...HEAD 2>/dev/null || echo "ledger.jsonl")

          # Run the invariant checker
          python check_append_invariant.py \
            /tmp/base_ledger.jsonl \
            ledger.jsonl \
            --changed-files $CHANGED_FILES
