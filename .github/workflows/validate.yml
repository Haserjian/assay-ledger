name: Validate Ledger

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Detect whether this is a checkpoint-only PR.
      # Checkpoint publication PRs touch only checkpoints/** and must be gated
      # by checkpoint-validate, not the ledger append invariant.
      # All subsequent steps skip when checkpoint_only=true, so branch
      # protection sees validate as passing without running the wrong checks.
      - name: Detect PR scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 2>/dev/null || true
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" 2>/dev/null || echo "")
            NON_CHECKPOINT=$(echo "$CHANGED" | grep -v '^checkpoints/' | grep -v '^$' || true)
            if [ -z "$NON_CHECKPOINT" ]; then
              echo "checkpoint_only=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Checkpoint-only PR — ledger validation skipped. checkpoint-validate covers this lane."
            else
              echo "checkpoint_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "checkpoint_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.scope.outputs.checkpoint_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        if: steps.scope.outputs.checkpoint_only != 'true'
        run: pip install pytest pynacl fastapi httpx --quiet

      - name: Run adversarial regression tests
        if: steps.scope.outputs.checkpoint_only != 'true'
        run: python -m pytest tests/ -v

      - name: Validate ledger.jsonl
        if: steps.scope.outputs.checkpoint_only != 'true'
        run: python validate_ledger.py

      - name: Verify latest checkpoint (if present)
        if: steps.scope.outputs.checkpoint_only != 'true'
        run: |
          if ls checkpoints/checkpoint_*.json 1>/dev/null 2>&1; then
            python validate_ledger.py --require-checkpoint
          else
            echo "No checkpoints present — skipping checkpoint verification"
          fi

      - name: Check append invariant (PRs and merge queue)
        if: (steps.scope.outputs.checkpoint_only != 'true') && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        run: |
          # Determine base ref
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE_REF="${{ github.event.merge_group.base_ref }}"
          else
            BASE_REF="origin/${{ github.base_ref }}"
          fi

          # Fetch base branch and extract base ledger
          git fetch origin "${{ github.base_ref || github.event.merge_group.base_ref }}" --depth=1 2>/dev/null || true
          git show "${BASE_REF}:ledger.jsonl" > /tmp/base_ledger.jsonl 2>/dev/null || touch /tmp/base_ledger.jsonl

          # Get changed files for scope check
          CHANGED_FILES=$(git diff --name-only "${BASE_REF}"...HEAD 2>/dev/null || echo "ledger.jsonl")

          # Run the invariant checker
          python check_append_invariant.py \
            /tmp/base_ledger.jsonl \
            ledger.jsonl \
            --changed-files $CHANGED_FILES
