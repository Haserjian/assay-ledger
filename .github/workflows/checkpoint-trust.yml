name: Checkpoint Trust Gate

# Two-stage ratchet:
#   Stage 1 (now): Verify latest checkpoint is registry-valid (T0+ accepted).
#                  Runs on every push to main and every PR.
#   Stage 2 (after T1 key provisioned): Add --require-t1 to Stage 1.
#                  Do not add --require-t1 until a T1 entry exists in signers.json.
#
# To promote to Stage 2:
#   1. Generate an Ed25519 key pair.
#   2. Store the private seed in GitHub Secrets as LEDGER_SIGNING_KEY.
#   3. Add a T1 entry to signers.json with the pubkey_sha256.
#   4. Change the verify step below to add --require-t1.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  checkpoint-trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pynacl --quiet

      - name: Verify latest checkpoint against registry
        run: |
          # Stage 1: registry validation — T0 accepted, unregistered rejected.
          # Switch to --require-t1 once a T1 signer entry is in signers.json.
          if ls checkpoints/checkpoint_*.json 1>/dev/null 2>&1; then
            LATEST=$(ls checkpoints/checkpoint_*.json | sort | tail -1)
            echo "Verifying checkpoint: $LATEST"
            # Stage 2: T1 enforcement active — assay-ci (T1) is in signers.json,
            # checkpoint_0002 (T1) is on main. Sub-T1 signers are now rejected.
            python verify_checkpoint.py "$LATEST" --registry signers.json --require-t1
          else
            echo "No checkpoints present — skipping trust gate"
          fi

